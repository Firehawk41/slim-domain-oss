[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slim-domain"
version = "0.13.0"
description = "Shared domain layer (Analysis/Chemical/Customer/Element + TR submission parsing) for the SLIM family of lab-operations tools."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    # openpyxl parses .xlsx internals (ZIP-wrapped XML) with plain
    # xml.etree.ElementTree unless this is installed, in which case it
    # auto-detects and prefers it -- openpyxl's own documented mitigation
    # against XML entity-expansion ("billion laughs") DoS from a
    # maliciously crafted workbook. Every .xlsx this system parses comes
    # from a real, but not fully trusted-to-be-well-formed, network
    # share (S:\Testing_Requests) -- worth the one dependency.
    "defusedxml>=0.7",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["slim_domain*", "infrastructure*"]

[tool.pytest.ini_options]
pythonpath = ["."]
